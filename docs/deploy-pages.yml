# 포털과 세 게임을 함께 빌드해 gh-pages 브랜치에 올린다. GitHub Pages는 gh-pages 브랜치(/ 루트)를 배포한다.
# - 포털 main에 푸시할 때
# - Actions 탭에서 직접 실행할 때(workflow_dispatch)
# - 게임 저장소가 repository_dispatch(game-updated)를 보낼 때
# - 매일 한 번(게임 저장소의 변경을 놓치지 않도록)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [game-updated]
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:all

      - name: Publish dist to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
