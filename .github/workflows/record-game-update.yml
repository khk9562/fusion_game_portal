# 게임 저장소의 알림(repository_dispatch: game-updated)을 받아 게임별 업데이트 기록을 main에 남기고 배포한다.
# 알림 내용: { repo: "owner/repo", sha: "커밋 해시", message: "커밋 메시지" }
name: Record game update

on:
  repository_dispatch:
    types: [game-updated]

permissions:
  contents: write

# 여러 게임이 동시에 알려도 기록이 꼬이지 않게 하나씩 처리한다
concurrency:
  group: record-game-update
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 알림 내용은 외부 입력이므로 스크립트에 직접 넣지 않고 환경 변수로 넘긴다
      - name: Update game-updates.json and GAME_UPDATES.md
        env:
          GAME_REPO: ${{ github.event.client_payload.repo }}
          GAME_SHA: ${{ github.event.client_payload.sha }}
          GAME_MESSAGE: ${{ github.event.client_payload.message }}
        run: node scripts/record-game-update.ts "$GAME_REPO" "$GAME_SHA" "$GAME_MESSAGE"

      - name: Commit to main
        id: commit
        env:
          GAME_REPO: ${{ github.event.client_payload.repo }}
          GAME_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "UPDATE: ${GAME_REPO#*/} ${GAME_SHA:0:7}"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: record
    if: needs.record.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: write
